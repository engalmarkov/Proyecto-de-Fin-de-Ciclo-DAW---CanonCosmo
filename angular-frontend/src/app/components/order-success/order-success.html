<div class="max-w-4xl mx-auto px-4 py-20 text-center">
  <div class="inline-flex items-center justify-center w-24 h-24 bg-friki-neon/10 rounded-full mb-8 border border-friki-neon/30 animate-bounce">
      <i class="fa-solid fa-check text-5xl text-friki-neon"></i>
  </div>
  
  <h1 class="text-4xl md:text-6xl font-black font-orbitron text-white mb-6 uppercase tracking-tighter">
      ¡MISIÓN <span class="text-friki-neon">COMPLETADA!</span>
  </h1>
  
  <p class="text-xl text-slate-400 mb-12 max-w-2xl mx-auto">
      Tu solicitud ha sido procesada por la Inteligencia Imperial. Hemos forjado tu pedido con éxito.
  </p>

  <div *ngIf="order" class="bg-friki-card border border-slate-800 rounded-3xl p-10 mb-12 max-w-md mx-auto text-left">
      <h2 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-6 border-b border-slate-800 pb-4">Detalles del Artefacto</h2>
      <div class="space-y-4">
          <div class="flex justify-between">
              <span class="text-slate-400">Nº de Pedido:</span>
              <span class="text-white font-mono font-bold">{{ order.numero_pedido || order.numero_orden }}</span>
          </div>
          <div class="flex justify-between">
              <span class="text-slate-400">Estatus:</span>
              <span class="px-3 py-1 bg-yellow-500/10 text-yellow-500 text-xs font-bold rounded-lg border border-yellow-500/30 uppercase">
                  {{ order.estado }}
              </span>
          </div>
      </div>
  </div>

  <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <a routerLink="/" class="px-8 py-4 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-700 transition-all">
          VOLVER AL INICIO
      </a>
      <a routerLink="/productos" class="px-8 py-4 bg-friki-neon text-friki-dark font-black rounded-xl hover:bg-white transition-all transform hover:scale-105">
          SEGUIR EXPLORANDO
      </a>
  </div>
</div>
