<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-friki-card p-10 rounded-3xl border border-slate-800 shadow-2xl relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-friki-neon to-transparent"></div>
      
      <div class="text-center">
            <h2 class="mt-6 text-3xl font-black font-orbitron text-white">
                    BIENVENIDO, <span class="text-friki-neon">
                        {{ user()?.nombre || 'HÉROE' }}
                    </span>
            </h2>
          <p class="mt-2 text-sm text-slate-400">
              Identifícate para acceder a tu inventario
          </p>
      </div>

      <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div *ngIf="error" class="bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded-xl text-sm">
              {{ error }}
          </div>

          <div class="space-y-4">
              <div>
                  <label for="username" class="block text-sm font-bold text-slate-300 mb-2">Email</label>
                  <input type="email" formControlName="username" id="username" class="appearance-none relative block w-full px-4 py-3 border border-slate-700 placeholder-slate-500 text-white bg-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-friki-neon focus:border-transparent transition-all sm:text-sm" placeholder="tu@universo.com">
              </div>
              <div>
                  <label for="password" class="block text-sm font-bold text-slate-300 mb-2">Contraseña</label>
                  <input type="password" formControlName="password" id="password" class="appearance-none relative block w-full px-4 py-3 border border-slate-700 placeholder-slate-500 text-white bg-slate-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-friki-neon focus:border-transparent transition-all sm:text-sm">
              </div>
          </div>

          <div>
              <button type="submit" 
                      [disabled]="loginForm.invalid || loading"
                      class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-black rounded-xl text-friki-dark bg-friki-neon hover:bg-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-friki-neon transition-all transform active:scale-95 shadow-lg shadow-friki-neon/20 uppercase tracking-widest font-orbitron disabled:opacity-50">
                  <span *ngIf="!loading">INICIAR SESIÓN</span>
                  <span *ngIf="loading" class="animate-pulse">CARGANDO...</span>
              </button>
          </div>
      </form>

      <div class="text-center mt-6">
          <p class="text-slate-400 text-sm">
              ¿Aún no eres parte de nuestra comunidad? 
              <a routerLink="/registro" class="font-bold text-friki-neon hover:text-white transition-colors">Regístrate ahora</a>
          </p>
      </div>
  </div>
</div>
