<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div *ngIf="loading" class="flex justify-center py-20">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-friki-neon"></div>
  </div>

  <div *ngIf="!loading && product" class="grid grid-cols-1 lg:grid-cols-2 gap-12">
      <div class="space-y-4">
          <div class="bg-friki-card rounded-3xl border border-slate-800 overflow-hidden relative group">
              <img [src]="product.imagen_url || 'https://placehold.co/800x800/1e293b/22c55e?text=' + product.nombre" 
                   class="w-full h-auto object-cover aspect-square" 
                   [alt]="product.nombre">
          </div>
      </div>

      <div class="flex flex-col">
          <div class="mb-6">
              <span class="inline-block px-3 py-1 rounded-full bg-friki-accent/10 border border-friki-accent/30 text-friki-accent text-xs font-bold tracking-widest uppercase mb-4">
                  {{ product.categoria.nombre }}
              </span>
              <h1 class="text-4xl md:text-5xl font-bold font-orbitron mb-4 leading-tight">{{ product.nombre }}</h1>
              <div class="text-3xl font-bold text-friki-neon mb-8">
                  {{ product.precio }}€
              </div>
          </div>

          <div class="max-w-none mb-10 text-slate-400">
              <p class="text-lg leading-relaxed">
                  {{ product.descripcion }}
              </p>
          </div>

          <div class="bg-slate-900/50 p-8 rounded-3xl border border-slate-800 mb-8">
              <div class="flex items-center justify-between mb-6">
                  <div class="flex items-center space-x-2">
                      <div class="w-3 h-3 rounded-full" [class.bg-green-500]="product.stock > 0" [class.bg-red-500]="product.stock <= 0"></div>
                      <span class="font-bold text-sm" [class.text-green-400]="product.stock > 0" [class.text-red-400]="product.stock <= 0">
                          {{ product.stock > 0 ? 'EN STOCK' : 'SIN STOCK' }}
                      </span>
                  </div>
              </div>

              <div class="flex flex-col sm:flex-row gap-4">
                  <div class="flex items-center bg-slate-800 rounded-xl px-4 py-2 border border-slate-700">
                      <button (click)="decrementQty()" class="p-2 text-slate-400 hover:text-white"><i class="fa-solid fa-minus"></i></button>
                      <span class="w-12 text-center font-bold text-white">{{ quantity }}</span>
                      <button (click)="incrementQty()" class="p-2 text-slate-400 hover:text-white"><i class="fa-solid fa-plus"></i></button>
                  </div>
                  
                  <button (click)="addToCart()" 
                          [disabled]="product.stock <= 0"
                          class="flex-grow bg-friki-neon text-friki-dark font-black py-4 px-8 rounded-xl hover:bg-white transition-all transform active:scale-95 flex items-center justify-center space-x-3 shadow-lg shadow-friki-neon/10 disabled:opacity-50 disabled:cursor-not-allowed">
                      <i class="fa-solid fa-cart-shopping"></i>
                      <span>AÑADIR AL CARRO</span>
                  </button>
              </div>
          </div>
      </div>
  </div>

  <div *ngIf="!loading && !product" class="text-center py-24">
      <i class="fa-solid fa-ghost text-6xl text-slate-700 mb-6"></i>
      <h2 class="text-3xl font-orbitron mb-4">Producto no encontrado en nuestros sistemas</h2>
      <a routerLink="/productos" class="text-friki-neon hover:underline uppercase font-black">Volver al catálogo</a>
  </div>
</div>
